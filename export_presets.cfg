[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, tests/*, tools/*, media/*, *.md, assets/art/decals/style_sources_v2/*, build/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
/* Phones and tablets: not supported yet. Show a note and stop the page here,
   before the engine and the game data (100+ MB) start downloading. */
(function () {
	var ua = navigator.userAgent;
	var mobile = /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle|Opera Mini|IEMobile/i.test(ua)
		|| (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
		|| (navigator.userAgentData && navigator.userAgentData.mobile);
	if (!mobile) return;
	window.GF_MOBILE_BLOCKED = true;
	document.write('<style>html,body{margin:0;height:100%;background:#17120e;color:#efe6d6;font-family:system-ui,sans-serif}'
		+ '.gf{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}'
		+ '.gf h1{margin:0 0 6px;font-size:34px;letter-spacing:2px;color:#f2c14e}'
		+ '.gf h2{margin:18px 0 10px;font-size:22px}'
		+ '.gf p{margin:6px 0;max-width:420px;line-height:1.5;color:#cbbfab;font-size:16px}</style>'
		+ '</head><body><div class=gf><h1>GULLY FIGHT</h1>'
		+ '<h2>Sorry, we are not on phones and tablets yet</h2>'
		+ '<p>Mobile and tablet browsers are coming soon.</p>'
		+ '<p>For now, please play on a laptop or desktop computer in Chrome, Edge or Firefox.</p>'
		+ '</div></body></html>');
	window.stop();
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
